<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sort Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050510;
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-deep);
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridPulse 2s ease-in-out infinite alternate;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        @keyframes gridPulse {
            0% { background-size: 40px 40px; opacity: 0.8; }
            100% { background-size: 42px 42px; opacity: 1; }
        }

        .game-container {
            width: 100%;
            max-width: 660px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 30px;
            padding: 25px;
            box-shadow:
                0 0 40px rgba(0, 255, 255, 0.4),
                0 0 80px rgba(255, 0, 255, 0.3),
                inset 0 0 40px rgba(0, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            gap: 15px;
        }

        .move-counter {
            font-size: 1.3rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            text-shadow: 0 0 8px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-magenta);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
            backdrop-filter: blur(10px);
            font-family: 'Orbitron', sans-serif;
        }

        button:hover {
            background: rgba(255, 0, 255, 0.3);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 50px var(--neon-magenta);
            transform: translateY(-2px);
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        button.primary-cta {
            background: var(--neon-magenta);
            border-color: var(--neon-magenta);
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 30px var(--neon-magenta);
        }

        button.primary-cta:hover {
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 40px var(--neon-cyan);
            color: #000;
        }

        .tube-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin: 25px 0;
            justify-items: center;
        }

        .tube {
            width: 75px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 0 0 30px 30px;
            padding: 15px 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-top: 2px solid rgba(0, 255, 255, 0.8);
            transition: all 0.2s ease;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 15px rgba(0, 255, 255, 0.1);
            position: relative;
            overflow: visible;
        }

        .tube::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            background: linear-gradient(180deg,
                    rgba(0,255,255,0.15) 0%,
                    rgba(255,0,255,0.1) 50%,
                    rgba(0,255,255,0.15) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .tube:hover {
            border-color: var(--neon-cyan);
            box-shadow:
                0 0 35px var(--neon-cyan),
                inset 0 0 20px rgba(0, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        .tube.selected {
            border-color: var(--neon-magenta);
            background: rgba(255, 0, 255, 0.2);
            box-shadow:
                0 0 40px var(--neon-magenta),
                0 0 80px rgba(255, 0, 255, 0.5),
                inset 0 0 25px rgba(255, 0, 255, 0.3);
            transform: translateY(-6px);
        }

        .tube.empty {
            opacity: 0.5;
            border-style: dashed;
        }

        .tube > * {
            z-index: 1;
            position: relative;
        }

        .slot {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(0,0,0,0.6));
            box-shadow:
                inset 0 0 10px rgba(0,0,0,0.8),
                0 0 6px rgba(0,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 1.2rem;
            transition: all 0.15s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .slot.filled {
            background: radial-gradient(circle at 40% 40%, #fff 5%, var(--color) 60%);
            box-shadow:
                0 0 4px var(--color),
                0 0 6px rgba(0,255,255,0.3),
                inset 0 0 2px rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.4);
            animation: orbGlow 2s ease-in-out infinite alternate;
        }

        @keyframes orbGlow {
            0% { box-shadow: 0 0 3px var(--color), 0 0 6px rgba(0,255,255,0.2); }
            100% { box-shadow: 0 0 5px var(--color), 0 0 10px rgba(255,0,255,0.25); }
        }

        .letter-overlay {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 8px rgba(255,255,255,0.3);
        }

        .seed-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 15px 0 5px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 8px 15px;
            border: 1px solid rgba(0,255,255,0.4);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
        }

        .seed-input {
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.6);
            color: var(--neon-cyan);
            flex: 1;
            min-width: 120px;
            outline: none;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .seed-input::placeholder {
            color: rgba(0,255,255,0.4);
        }

        .seed-input:focus {
            border-color: var(--neon-magenta);
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        select {
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0,0,0,0.6);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0,255,255,0.3);
        }

        select option {
            background: #111;
            color: #0ff;
        }

        .settings-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        label.checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            font-size: 0.8rem;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(30px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 60px var(--neon-cyan);
            max-width: 400px;
            width: 90%;
        }

        .win-modal h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #0ff, #f0f, #0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 1s infinite alternate;
        }

        @keyframes glowText {
            from { text-shadow: 0 0 15px #0ff; }
            to { text-shadow: 0 0 40px #f0f; }
        }

        .win-modal p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        @media (max-width: 500px) {
            .tube-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .tube {
                width: 65px;
            }
            .slot {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="move-counter">🎯 MOVES <span id="moveDisplay">0</span></div>
        <div class="buttons">
            <button id="undoBtn">↩ UNDO</button>
            <button id="restartBtn">↺ RESTART</button>
        </div>
    </div>
    <div class="tube-grid" id="tubeGrid"></div>
    <div class="seed-area">
        <input type="text" class="seed-input" id="seedInput" placeholder="SEED">
        <button id="loadSeedBtn" class="primary-cta">LOAD</button>
        <button id="newPuzzleBtn">✨ NEW</button>
        <button id="copySeedBtn">📋 COPY</button>
        <select id="difficultySelect">
            <option value="easy">EASY</option>
            <option value="medium" selected>MED</option>
            <option value="hard">HARD</option>
        </select>
    </div>
    <div class="settings-row">
        <label class="checkbox-label">
            <input type="checkbox" id="showLettersCheck"> <span>LETTERS (A11Y)</span>
        </label>
        <button id="editColorsBtn" class="secondary" style="font-size:0.75rem;">🎨 COLORS</button>
        <button id="leaderboardBtn" style="font-size:0.75rem;">🏆 LEADERBOARD</button>
    </div>
</div>

<!-- Win overlay -->
<div class="overlay win-overlay" id="winOverlay">
    <div class="modal win-modal">
        <h2>✨ SORTED! ✨</h2>
        <p>MOVES: <span id="winMoves"></span></p>
        <button id="winNewPuzzle" class="primary-cta">NEW</button>
        <button id="winRestart" class="secondary">RESTART</button>
        <button id="winCopySeed" class="secondary">COPY SEED</button>
    </div>
</div>

<!-- Leaderboard overlay -->
<div class="overlay" id="leaderboardOverlay">
    <div class="modal">
        <h3>🏆 LEADERBOARD</h3>
        <div id="leaderboardList" style="max-height:300px; overflow-y:auto; margin: 15px 0;"></div>
        <button id="closeLeaderboard">CLOSE</button>
    </div>
</div>

<!-- Color editor overlay -->
<div class="overlay" id="colorEditorOverlay">
    <div class="modal">
        <h3>CUSTOMIZE COLORS</h3>
        <div id="colorEditorRows"></div>
        <button id="closeColorEditor">CLOSE</button>
        <button id="resetColorsBtn">RESET DEFAULT</button>
    </div>
</div>

<script src="puzzleLogic.js"></script>
<script>
    const API_BASE = 'https://color-sort-backend.onrender.com';  // Your Render backend
    const PL = window.PuzzleLogic;
    const DEFAULT_COLORS = PL.DEFAULT_COLORS;
    let COLORS = loadColors();
    let tubes, initialTubes, moveHistory, moveCount, selectedTubeIndex;
    let currentSeed = 'neon-arcade', currentDifficulty = 'medium', showLetters = false;
    let currentMoves = [];   // Records { src, dst } per move for submission

    function loadColors() {
        const stored = localStorage.getItem('neonSortColors');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length === 10) return parsed;
            } catch(e) {}
        }
        return DEFAULT_COLORS.map(c => ({...c}));
    }
    function saveColors() { localStorage.setItem('neonSortColors', JSON.stringify(COLORS)); }

    // DOM refs
    const tubeGrid = document.getElementById('tubeGrid');
    const moveDisplay = document.getElementById('moveDisplay');
    const seedInput = document.getElementById('seedInput');
    const winOverlay = document.getElementById('winOverlay');
    const winMovesSpan = document.getElementById('winMoves');
    const leaderboardOverlay = document.getElementById('leaderboardOverlay');
    const leaderboardList = document.getElementById('leaderboardList');
    const leaderboardBtn = document.getElementById('leaderboardBtn');
    const closeLeaderboardBtn = document.getElementById('closeLeaderboard');

    function deepCopyTubes(t) { return PL.deepCopyTubes(t); }
    function getOccupiedCount(t) { return PL.getOccupiedCount(t); }

    function performMove(src, dst) {
        const ok = PL.performMove(tubes, src, dst);
        if (ok) {
            moveHistory.push(deepCopyTubes(tubes));
            currentMoves.push({ src, dst });
        }
        return ok;
    }
    function isWinState(state) { return PL.isWinState(state); }
    function generatePuzzle(seed, diff) { return PL.generatePuzzle(seed, diff, COLORS); }

    function renderTubes() {
        tubeGrid.innerHTML = '';
        tubes.forEach((tube, idx) => {
            const d = document.createElement('div');
            d.className = 'tube' + (idx === selectedTubeIndex ? ' selected' : '');
            if (!getOccupiedCount(tube)) d.classList.add('empty');
            for (let s = 0; s < PL.SLOTS_PER_TUBE; s++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                const col = tube[s];
                if (col) {
                    slot.classList.add('filled');
                    const cobj = COLORS.find(c => c.name === col);
                    slot.style.setProperty('--color', cobj.hex);
                    if (showLetters) slot.innerHTML = `<span class="letter-overlay">${cobj.letter}</span>`;
                }
                d.appendChild(slot);
            }
            d.addEventListener('click', () => handleTubeClick(idx));
            tubeGrid.appendChild(d);
        });
    }

    function handleTubeClick(idx) {
        if (selectedTubeIndex === -1) {
            if (getOccupiedCount(tubes[idx]) > 0) { selectedTubeIndex = idx; renderTubes(); }
        } else if (selectedTubeIndex === idx) {
            selectedTubeIndex = -1; renderTubes();
        } else {
            if (performMove(selectedTubeIndex, idx)) {
                moveCount++; moveDisplay.textContent = moveCount;
                selectedTubeIndex = -1; renderTubes();
                checkWinAndShow();
            } else {
                selectedTubeIndex = -1; renderTubes();
            }
        }
    }

    function undoMove() {
        if (!moveHistory.length) return;
        tubes = moveHistory.pop();
        currentMoves.pop();
        moveCount--; moveDisplay.textContent = moveCount;
        selectedTubeIndex = -1; renderTubes();
        winOverlay.style.display = 'none';
    }

    function restartPuzzle() {
        tubes = deepCopyTubes(initialTubes);
        moveHistory = []; moveCount = 0; currentMoves = [];
        moveDisplay.textContent = '0';
        selectedTubeIndex = -1; renderTubes();
        winOverlay.style.display = 'none';
    }

    function loadPuzzle(seed, diff) {
        currentSeed = seed; currentDifficulty = diff;
        seedInput.value = seed; document.getElementById('difficultySelect').value = diff;
        const p = generatePuzzle(seed, diff);
        initialTubes = deepCopyTubes(p);
        tubes = deepCopyTubes(p);
        moveHistory = []; moveCount = 0; currentMoves = [];
        moveDisplay.textContent = '0';
        selectedTubeIndex = -1; renderTubes();
        winOverlay.style.display = 'none';
    }

    function newRandomSeed() { return Math.random().toString(36).substr(2,8) + Date.now().toString(36); }

    // ─── Leaderboard functions ───
    async function submitScore(name) {
        const payload = {
            seed: currentSeed,
            difficulty: currentDifficulty,
            playerName: name.trim(),
            moves: currentMoves
        };
        try {
            const res = await fetch(`${API_BASE}/api/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                alert(`Score submitted! Moves: ${data.moveCount}`);
                showLeaderboard();   // auto-show leaderboard after submission
            } else {
                alert('Error: ' + data.error);
            }
        } catch(e) {
            alert('Network error – could not submit score.');
        }
    }

    async function showLeaderboard() {
        try {
            const res = await fetch(`${API_BASE}/api/leaderboard?difficulty=${currentDifficulty}`);
            const data = await res.json();
            leaderboardList.innerHTML = data.length
                ? data.map((e, i) => `<p>${i+1}. ${e.playerName} – ${e.moveCount} moves (seed: ${e.seed})</p>`).join('')
                : '<p>No scores yet.</p>';
            leaderboardOverlay.style.display = 'flex';
        } catch(e) {
            alert('Could not load leaderboard.');
        }
    }

    // Win detection with prompt for name
    function checkWinAndShow() {
        if (isWinState(tubes)) {
            winMovesSpan.textContent = moveCount;
            winOverlay.style.display = 'flex';
            setTimeout(() => {
                const name = prompt('🎉 You won! Enter your name for the leaderboard:');
                if (name) submitScore(name);
            }, 500);
        }
    }

    // Color editor
    function buildColorEditor() {
        const rows = document.getElementById('colorEditorRows');
        rows.innerHTML = '';
        COLORS.forEach((c, i) => {
            const row = document.createElement('div');
            row.className = 'color-row';
            row.innerHTML = `<span style="color:${c.hex}">${c.name}</span> <input type="color" value="${c.hex}" data-index="${i}">`;
            rows.appendChild(row);
        });
        document.querySelectorAll('#colorEditorRows input').forEach(inp => {
            inp.addEventListener('input', e => {
                const idx = parseInt(e.target.dataset.index);
                COLORS[idx].hex = e.target.value;
                saveColors();
                renderTubes();
            });
        });
    }
    document.getElementById('editColorsBtn').addEventListener('click', () => {
        buildColorEditor();
        document.getElementById('colorEditorOverlay').style.display = 'flex';
    });
    document.getElementById('closeColorEditor').addEventListener('click', () => {
        document.getElementById('colorEditorOverlay').style.display = 'none';
    });
    document.getElementById('resetColorsBtn').addEventListener('click', () => {
        COLORS = DEFAULT_COLORS.map(c => ({...c}));
        saveColors();
        renderTubes();
    });

    // Event listeners for game controls
    document.getElementById('undoBtn').addEventListener('click', undoMove);
    document.getElementById('restartBtn').addEventListener('click', restartPuzzle);
    document.getElementById('newPuzzleBtn').addEventListener('click', () => loadPuzzle(newRandomSeed(), currentDifficulty));
    document.getElementById('loadSeedBtn').addEventListener('click', () => {
        let s = seedInput.value.trim() || newRandomSeed();
        loadPuzzle(s, currentDifficulty);
    });
    document.getElementById('copySeedBtn').addEventListener('click', () => navigator.clipboard.writeText(currentSeed));
    document.getElementById('difficultySelect').addEventListener('change', e => loadPuzzle(currentSeed, e.target.value));
    document.getElementById('showLettersCheck').addEventListener('change', e => { showLetters = e.target.checked; renderTubes(); });

    // Win overlay buttons
    document.getElementById('winNewPuzzle').addEventListener('click', () => {
        winOverlay.style.display = 'none';
        loadPuzzle(newRandomSeed(), currentDifficulty);
    });
    document.getElementById('winRestart').addEventListener('click', () => {
        winOverlay.style.display = 'none';
        restartPuzzle();
    });
    document.getElementById('winCopySeed').addEventListener('click', () => navigator.clipboard.writeText(currentSeed));

    // Leaderboard UI listeners
    leaderboardBtn.addEventListener('click', showLeaderboard);
    closeLeaderboardBtn.addEventListener('click', () => {
        leaderboardOverlay.style.display = 'none';
    });

    // Start the game
    loadPuzzle('neon-arcade', 'medium');
</script>
</body>
</html>
