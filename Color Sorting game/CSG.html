<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sort Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050510;
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-deep);
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridPulse 2s ease-in-out infinite alternate;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
            margin: 0;
        }

        @keyframes gridPulse {
            0% { background-size: 60px 60px; opacity: 0.8; }
            100% { background-size: 63px 63px; opacity: 1; }
        }

        /* Start overlay */
        .start-overlay {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .start-modal {
            text-align: center;
        }
        .start-modal h1 {
            font-size: 3rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, #0ff, #f0f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .start-btn {
            font-size: 1.5rem;
            padding: 20px 60px;
        }

        .game-container {
            display: none;
            width: 100%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 45px;
            padding: 35px;
            box-shadow:
                0 0 60px rgba(0, 255, 255, 0.4),
                0 0 120px rgba(255, 0, 255, 0.3),
                inset 0 0 60px rgba(0, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            gap: 20px;
        }

        .move-counter {
            font-size: 1.8rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 60px;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            text-shadow: 0 0 12px var(--neon-cyan);
            letter-spacing: 3px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-magenta);
            color: #fff;
            padding: 14px 25px;
            border-radius: 45px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(255, 0, 255, 0.4);
            backdrop-filter: blur(10px);
            font-family: 'Orbitron', sans-serif;
        }

        button:hover {
            background: rgba(255, 0, 255, 0.3);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 35px var(--neon-cyan), 0 0 70px var(--neon-magenta);
            transform: translateY(-3px);
            text-shadow: 0 0 8px #fff;
        }

        button.primary-cta {
            background: var(--neon-magenta);
            border-color: var(--neon-magenta);
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 45px var(--neon-magenta);
        }

        button.primary-cta:hover {
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 60px var(--neon-cyan);
            color: #000;
        }

        .tube-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin: 35px 0;
            justify-items: center;
        }

        .tube {
            width: 130px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 45px;
            padding: 20px 15px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 2px solid rgba(0, 255, 255, 0.5);
            transition: all 0.2s ease;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            position: relative;
            overflow: visible;
        }

        .tube::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 45px;
            background: linear-gradient(180deg,
                    rgba(0,255,255,0.15) 0%,
                    rgba(255,0,255,0.1) 50%,
                    rgba(0,255,255,0.15) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .tube:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 50px var(--neon-cyan), inset 0 0 30px rgba(0,255,255,0.2);
            transform: translateY(-6px);
        }

        .tube.selected {
            border-color: var(--neon-magenta);
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 60px var(--neon-magenta), 0 0 120px rgba(255,0,255,0.5), inset 0 0 35px rgba(255,0,255,0.3);
            transform: translateY(-8px);
        }

        .tube.empty {
            opacity: 0.5;
            border-style: dashed;
        }

        .tube > * {
            z-index: 1;
            position: relative;
        }

        /* Capsule slot */
        .slot {
            width: 96px;
            height: 32px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 0.9rem;
            transition: all 0.15s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .slot.filled {
            background: linear-gradient(180deg,
                rgba(255,255,255,0.5) 0%,
                var(--color) 40%,
                var(--color) 60%,
                rgba(0,0,0,0.4) 100%);
            box-shadow: 0 0 8px var(--color), 0 0 14px rgba(0,255,255,0.4), inset 0 0 3px rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.4);
            animation: orbGlow 2s infinite alternate;
        }

        @keyframes orbGlow {
            0% { box-shadow: 0 0 6px var(--color), 0 0 10px rgba(0,255,255,0.3); }
            100% { box-shadow: 0 0 10px var(--color), 0 0 18px rgba(255,0,255,0.3); }
        }

        .letter-overlay {
            font-size: 1rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.5);
        }

        /* Seed / difficulty area */
        .seed-area {
            margin: 25px 0 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 20px;
            border: 1px solid rgba(0,255,255,0.4);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
        }

        .seed-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .seed-row:last-child {
            margin-bottom: 0;
        }

        .seed-label {
            font-size: 0.9rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .seed-input {
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.6);
            color: var(--neon-cyan);
            flex: 1;
            min-width: 200px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .seed-input:focus {
            border-color: var(--neon-magenta);
            box-shadow: 0 0 25px var(--neon-magenta);
        }

        select {
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0,0,0,0.6);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0,255,255,0.3);
        }

        .settings-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--neon-cyan);
            text-transform: uppercase;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(30px);
            padding: 50px;
            border-radius: 45px;
            text-align: center;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 90px var(--neon-cyan);
            max-width: 500px;
            width: 90%;
        }

        .win-modal h2 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #0ff, #f0f, #0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 1s infinite alternate;
        }

        @keyframes glowText {
            from { text-shadow: 0 0 25px #0ff; }
            to { text-shadow: 0 0 60px #f0f; }
        }

        .win-modal p {
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 700px) {
            .tube {
                width: 110px;
                padding: 15px 10px;
            }
            .slot {
                width: 80px;
            }
        }
    </style>
</head>
<body>

<!-- START overlay -->
<div class="start-overlay" id="startOverlay">
    <div class="start-modal">
        <h1>NEON SORT PUZZLE</h1>
        <button id="startBtn" class="start-btn primary-cta">START</button>
        <p id="wakeMsg" style="margin-top:20px; opacity:0.8;"></p>
    </div>
</div>

<div class="game-container" id="gameContainer">
    <div class="header">
        <div class="move-counter">🎯 MOVES <span id="moveDisplay">0</span></div>
        <div class="buttons">
            <button id="undoBtn">↩ UNDO</button>
            <button id="restartBtn">↺ RESTART</button>
        </div>
    </div>

    <div class="tube-grid" id="tubeGrid"></div>

    <!-- Seed / Difficulty area (single-line seed row) -->
    <div class="seed-area">
        <div class="seed-row">
            <span class="seed-label">SEED</span>
            <input type="text" class="seed-input" id="seedInput" placeholder="Enter seed...">
            <button id="loadSeedBtn" class="primary-cta">LOAD</button>
            <button id="newPuzzleBtn">✨ NEW</button>
            <button id="copySeedBtn">📋 COPY</button>
        </div>
        <div class="seed-row">
            <span class="seed-label">DIFFICULTY</span>
            <select id="difficultySelect">
                <option value="easy">EASY</option>
                <option value="medium" selected>MED</option>
                <option value="hard">HARD</option>
            </select>
        </div>
    </div>

    <div class="settings-row">
        <label class="checkbox-label">
            <input type="checkbox" id="showLettersCheck"> <span>🔤 SHOW LETTERS</span>
        </label>
        <button id="editColorsBtn">🎨 COLORS</button>
        <button id="leaderboardBtn">🏆 LEADERBOARD</button>
    </div>
</div>

<!-- Win overlay -->
<div class="overlay win-overlay" id="winOverlay">
    <div class="modal win-modal">
        <h2>✨ SORTED! ✨</h2>
        <p>MOVES: <span id="winMoves"></span></p>
        <div id="winTop5" style="text-align:left; margin:20px 0; max-height:150px; overflow-y:auto;"></div>
        <button id="winNewPuzzle" class="primary-cta">NEW</button>
        <button id="winRestart">RESTART</button>
        <button id="winCopySeed">COPY SEED</button>
        <button id="winClose" class="secondary" style="margin-top:10px;">CLOSE</button>
    </div>
</div>

<!-- Leaderboard overlay -->
<div class="overlay" id="leaderboardOverlay">
    <div class="modal" style="max-width:550px;">
        <h3>🏆 LEADERBOARD</h3>
        <div id="leaderboardList" style="max-height:350px; overflow-y:auto; margin:15px 0; text-align:left;"></div>
        <div id="playerPlacement" style="margin-bottom:10px;"></div>
        <button id="closeLeaderboard">CLOSE</button>
    </div>
</div>

<!-- Color editor overlay -->
<div class="overlay" id="colorEditorOverlay">
    <div class="modal">
        <h3>CUSTOMIZE COLORS</h3>
        <div id="colorEditorRows"></div>
        <button id="closeColorEditor">CLOSE</button>
        <button id="resetColorsBtn">RESET DEFAULT</button>
    </div>
</div>

<script src="puzzleLogic.js"></script>
<script>
    const API_BASE = 'https://color-sort-backend.onrender.com';
    const PL = window.PuzzleLogic;
    const DEFAULT_COLORS = PL.DEFAULT_COLORS;
    let COLORS = loadColors();
    let tubes, initialTubes, moveHistory, moveCount, selectedTubeIndex;
    let currentSeed = 'neon-arcade', currentDifficulty = 'medium', showLetters = false;
    let currentMoves = [];

    function loadColors() {
        const stored = localStorage.getItem('neonSortColors');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length === 10) return parsed;
            } catch(e) {}
        }
        return DEFAULT_COLORS.map(c => ({...c}));
    }
    function saveColors() { localStorage.setItem('neonSortColors', JSON.stringify(COLORS)); }

    const startOverlay = document.getElementById('startOverlay');
    const gameContainer = document.getElementById('gameContainer');
    const wakeMsg = document.getElementById('wakeMsg');
    const startBtn = document.getElementById('startBtn');

    startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        wakeMsg.textContent = 'Waking server…';
        try {
            const res = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(10000) });
            if (res.ok) wakeMsg.textContent = 'Server ready!';
            else wakeMsg.textContent = 'Server slow, but continuing…';
        } catch(e) {
            wakeMsg.textContent = 'Server offline. You can still play locally.';
        }
        setTimeout(() => {
            startOverlay.style.display = 'none';
            gameContainer.style.display = 'block';
            loadPuzzle(currentSeed, currentDifficulty);
        }, 1500);
    });

    const tubeGrid = document.getElementById('tubeGrid');
    const moveDisplay = document.getElementById('moveDisplay');
    const seedInput = document.getElementById('seedInput');
    const winOverlay = document.getElementById('winOverlay');
    const winMovesSpan = document.getElementById('winMoves');
    const winTop5 = document.getElementById('winTop5');
    const leaderboardOverlay = document.getElementById('leaderboardOverlay');
    const leaderboardList = document.getElementById('leaderboardList');
    const playerPlacement = document.getElementById('playerPlacement');
    const leaderboardBtn = document.getElementById('leaderboardBtn');
    const closeLeaderboardBtn = document.getElementById('closeLeaderboard');

    function deepCopyTubes(t) { return PL.deepCopyTubes(t); }
    function getOccupiedCount(t) { return PL.getOccupiedCount(t); }

    // Fixed: save state BEFORE the move
    function performMove(src, dst) {
        const stateBefore = deepCopyTubes(tubes);
        const ok = PL.performMove(tubes, src, dst);
        if (ok) {
            moveHistory.push(stateBefore);
            currentMoves.push({ src, dst });
        }
        return ok;
    }

    function isWinState(state) { return PL.isWinState(state); }
    function generatePuzzle(seed, diff) { return PL.generatePuzzle(seed, diff, COLORS); }

    function renderTubes() {
        tubeGrid.innerHTML = '';
        tubes.forEach((tube, idx) => {
            const d = document.createElement('div');
            d.className = 'tube' + (idx === selectedTubeIndex ? ' selected' : '');
            if (!getOccupiedCount(tube)) d.classList.add('empty');
            for (let s = 0; s < PL.SLOTS_PER_TUBE; s++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                const col = tube[s];
                if (col) {
                    slot.classList.add('filled');
                    const cobj = COLORS.find(c => c.name === col);
                    slot.style.setProperty('--color', cobj.hex);
                    if (showLetters) slot.innerHTML = `<span class="letter-overlay">${cobj.letter}</span>`;
                }
                d.appendChild(slot);
            }
            d.addEventListener('click', () => handleTubeClick(idx));
            tubeGrid.appendChild(d);
        });
    }

    function handleTubeClick(idx) {
        if (selectedTubeIndex === -1) {
            if (getOccupiedCount(tubes[idx]) > 0) { selectedTubeIndex = idx; renderTubes(); }
        } else if (selectedTubeIndex === idx) {
            selectedTubeIndex = -1; renderTubes();
        } else {
            if (performMove(selectedTubeIndex, idx)) {
                moveCount++; moveDisplay.textContent = moveCount;
                selectedTubeIndex = -1; renderTubes();
                checkWinAndShow();
            } else {
                selectedTubeIndex = -1; renderTubes();
            }
        }
    }

    function undoMove() {
        if (!moveHistory.length) return;
        tubes = moveHistory.pop();
        currentMoves.pop();
        moveCount--; moveDisplay.textContent = moveCount;
        selectedTubeIndex = -1; renderTubes();
        winOverlay.style.display = 'none';
    }

    function restartPuzzle() {
        tubes = deepCopyTubes(initialTubes);
        moveHistory = []; moveCount = 0; currentMoves = [];
        moveDisplay.textContent = '0';
        selectedTubeIndex = -1; renderTubes();
        winOverlay.style.display = 'none';
    }

    function loadPuzzle(seed, diff) {
        currentSeed = seed; currentDifficulty = diff;
        seedInput.value = seed; document.getElementById('difficultySelect').value = diff;
        const p = generatePuzzle(seed, diff);
        initialTubes = deepCopyTubes(p);
        tubes = deepCopyTubes(p);
        moveHistory = []; moveCount = 0; currentMoves = [];
        moveDisplay.textContent = '0';
        selectedTubeIndex = -1; renderTubes();
        winOverlay.style.display = 'none';
    }

    function newRandomSeed() { return Math.random().toString(36).substr(2,8) + Date.now().toString(36); }

    async function submitScore(name) {
        const payload = {
            seed: currentSeed,
            difficulty: currentDifficulty,
            playerName: name.trim(),
            moves: currentMoves
        };
        try {
            const res = await fetch(`${API_BASE}/api/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                alert(`Score submitted! Moves: ${data.moveCount}`);
                fetchLeaderboardForSeed();
            } else {
                alert('Error: ' + data.error);
            }
        } catch(e) {
            alert('Network error – could not submit score.');
        }
    }

    async function fetchLeaderboardForSeed() {
        try {
            const res = await fetch(`${API_BASE}/api/leaderboard?seed=${encodeURIComponent(currentSeed)}&difficulty=${currentDifficulty}`);
            const data = await res.json();
            displayLeaderboard(data.top, data.total);
            leaderboardOverlay.style.display = 'flex';
        } catch(e) {
            alert('Could not load leaderboard.');
        }
    }

    function displayLeaderboard(top, total) {
        let html = '';
        top.forEach((entry, i) => {
            let medal = '';
            if (i === 0) medal = '🥇';
            else if (i === 1) medal = '🥈';
            else if (i === 2) medal = '🥉';
            const time = new Date(entry.timestamp + 'Z').toLocaleString();
            html += `<div class="leaderboard-entry">
                <span>${medal} ${i+1}. ${entry.playerName} – ${entry.moveCount} moves</span>
                <span style="font-size:0.8rem; opacity:0.7;">${time}</span>
            </div>`;
        });
        leaderboardList.innerHTML = html || '<p>No scores yet.</p>';
        playerPlacement.innerHTML = total > 50 ? `<p>Only top 50 shown. Total entries: ${total}</p>` : '';
    }

    function checkWinAndShow() {
        if (isWinState(tubes)) {
            winMovesSpan.textContent = moveCount;
            winOverlay.style.display = 'flex';
            fetchTop5ForWin();
            setTimeout(() => {
                const name = prompt('🎉 You won! Enter your name for the leaderboard:');
                if (name) {
                    localStorage.setItem('lastPlayerName', name);
                    submitScore(name);
                }
            }, 500);
        }
    }

    async function fetchTop5ForWin() {
        try {
            const res = await fetch(`${API_BASE}/api/leaderboard?seed=${encodeURIComponent(currentSeed)}&difficulty=${currentDifficulty}`);
            const data = await res.json();
            const top = (data.top || []).slice(0, 5);
            let html = '<h4>TOP 5</h4>';
            if (top.length === 0) html += '<p>No scores yet.</p>';
            else {
                top.forEach((entry, i) => {
                    let medal = '';
                    if (i === 0) medal = '🥇';
                    else if (i === 1) medal = '🥈';
                    else if (i === 2) medal = '🥉';
                    html += `<div>${medal} ${i+1}. ${entry.playerName} – ${entry.moveCount} moves</div>`;
                });
            }
            winTop5.innerHTML = html;
        } catch(e) { winTop5.innerHTML = ''; }
    }

    document.getElementById('winClose').addEventListener('click', () => {
        winOverlay.style.display = 'none';
    });

    function buildColorEditor() {
        const rows = document.getElementById('colorEditorRows');
        rows.innerHTML = '';
        COLORS.forEach((c, i) => {
            const row = document.createElement('div');
            row.innerHTML = `<span style="color:${c.hex}">${c.name}</span> <input type="color" value="${c.hex}" data-index="${i}">`;
            rows.appendChild(row);
        });
        document.querySelectorAll('#colorEditorRows input').forEach(inp => {
            inp.addEventListener('input', e => {
                const idx = parseInt(e.target.dataset.index);
                COLORS[idx].hex = e.target.value;
                saveColors();
                renderTubes();
            });
        });
    }
    document.getElementById('editColorsBtn').addEventListener('click', () => {
        buildColorEditor();
        document.getElementById('colorEditorOverlay').style.display = 'flex';
    });
    document.getElementById('closeColorEditor').addEventListener('click', () => {
        document.getElementById('colorEditorOverlay').style.display = 'none';
    });
    document.getElementById('resetColorsBtn').addEventListener('click', () => {
        COLORS = DEFAULT_COLORS.map(c => ({...c}));
        saveColors();
        renderTubes();
    });

    document.getElementById('undoBtn').addEventListener('click', undoMove);
    document.getElementById('restartBtn').addEventListener('click', restartPuzzle);
    document.getElementById('newPuzzleBtn').addEventListener('click', () => loadPuzzle(newRandomSeed(), currentDifficulty));
    document.getElementById('loadSeedBtn').addEventListener('click', () => {
        let s = seedInput.value.trim() || newRandomSeed();
        loadPuzzle(s, currentDifficulty);
    });
    document.getElementById('copySeedBtn').addEventListener('click', () => navigator.clipboard.writeText(currentSeed));
    document.getElementById('difficultySelect').addEventListener('change', e => loadPuzzle(currentSeed, e.target.value));
    document.getElementById('showLettersCheck').addEventListener('change', e => { showLetters = e.target.checked; renderTubes(); });
    document.getElementById('winNewPuzzle').addEventListener('click', () => {
        winOverlay.style.display = 'none';
        loadPuzzle(newRandomSeed(), currentDifficulty);
    });
    document.getElementById('winRestart').addEventListener('click', () => {
        winOverlay.style.display = 'none';
        restartPuzzle();
    });
    document.getElementById('winCopySeed').addEventListener('click', () => navigator.clipboard.writeText(currentSeed));

    leaderboardBtn.addEventListener('click', fetchLeaderboardForSeed);
    closeLeaderboardBtn.addEventListener('click', () => leaderboardOverlay.style.display = 'none');
</script>
</body>
</html>
