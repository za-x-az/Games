<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sort Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050510;
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-deep);
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridPulse 2s ease-in-out infinite alternate;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        @keyframes gridPulse {
            0% { background-size: 40px 40px; opacity: 0.8; }
            100% { background-size: 42px 42px; opacity: 1; }
        }

        .game-container {
            width: 100%;
            max-width: 660px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 30px;
            padding: 25px;
            box-shadow:
                0 0 40px rgba(0, 255, 255, 0.4),
                0 0 80px rgba(255, 0, 255, 0.3),
                inset 0 0 40px rgba(0, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            gap: 15px;
        }

        .move-counter {
            font-size: 1.3rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            text-shadow: 0 0 8px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-magenta);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
            backdrop-filter: blur(10px);
            font-family: 'Orbitron', sans-serif;
        }

        button:hover {
            background: rgba(255, 0, 255, 0.3);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 50px var(--neon-magenta);
            transform: translateY(-2px);
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        button.primary-cta {
            background: var(--neon-magenta);
            border-color: var(--neon-magenta);
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 30px var(--neon-magenta);
        }

        button.primary-cta:hover {
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 40px var(--neon-cyan);
            color: #000;
        }

        .tube-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin: 25px 0;
            justify-items: center;
        }

        .tube {
            width: 75px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 0 0 30px 30px;
            padding: 15px 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-top: 2px solid rgba(0, 255, 255, 0.8);
            transition: all 0.2s ease;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 15px rgba(0, 255, 255, 0.1);
            position: relative;
            overflow: visible;
        }

        .tube::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            background: linear-gradient(180deg, 
                rgba(0,255,255,0.15) 0%, 
                rgba(255,0,255,0.1) 50%, 
                rgba(0,255,255,0.15) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .tube:hover {
            border-color: var(--neon-cyan);
            box-shadow:
                0 0 35px var(--neon-cyan),
                inset 0 0 20px rgba(0, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        .tube.selected {
            border-color: var(--neon-magenta);
            background: rgba(255, 0, 255, 0.2);
            box-shadow:
                0 0 40px var(--neon-magenta),
                0 0 80px rgba(255, 0, 255, 0.5),
                inset 0 0 25px rgba(255, 0, 255, 0.3);
            transform: translateY(-6px);
        }

        .tube.empty {
            opacity: 0.5;
            border-style: dashed;
        }

        .tube > * {
            z-index: 1;
            position: relative;
        }

        .slot {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(0,0,0,0.6));
            box-shadow:
                inset 0 0 10px rgba(0,0,0,0.8),
                0 0 6px rgba(0,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 1.2rem;
            transition: all 0.15s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .slot.filled {
            background: radial-gradient(circle at 40% 40%, #fff 5%, var(--color) 60%);
            box-shadow:
                0 0 4px var(--color),
                0 0 6px rgba(0,255,255,0.3),
                inset 0 0 2px rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.4);
            animation: orbGlow 2s ease-in-out infinite alternate;
        }

        @keyframes orbGlow {
            0% { box-shadow: 0 0 3px var(--color), 0 0 6px rgba(0,255,255,0.2); }
            100% { box-shadow: 0 0 5px var(--color), 0 0 10px rgba(255,0,255,0.25); }
        }

        .letter-overlay {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 8px rgba(255,255,255,0.3);
        }

        .seed-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 15px 0 5px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 8px 15px;
            border: 1px solid rgba(0,255,255,0.4);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
        }

        .seed-input {
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.6);
            color: var(--neon-cyan);
            flex: 1;
            min-width: 120px;
            outline: none;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .seed-input::placeholder {
            color: rgba(0,255,255,0.4);
        }

        .seed-input:focus {
            border-color: var(--neon-magenta);
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        select {
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0,0,0,0.6);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0,255,255,0.3);
        }

        select option {
            background: #111;
            color: #0ff;
        }

        .settings-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        label.checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--neon-cyan);
            font-size: 0.8rem;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .win-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .win-modal {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(30px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 60px var(--neon-cyan), 0 0 120px var(--neon-magenta);
            max-width: 350px;
            width: 90%;
        }

        .win-modal h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #0ff, #f0f, #0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 1s infinite alternate;
        }

        @keyframes glowText {
            from { text-shadow: 0 0 15px #0ff; }
            to { text-shadow: 0 0 40px #f0f; }
        }

        .win-modal p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .color-editor-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            z-index: 150;
        }

        .color-editor-modal {
            background: rgba(0,0,0,0.9);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 50px var(--neon-cyan);
        }

        .color-editor-modal h3 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }

        .color-row span {
            width: 80px;
            font-size: 0.9rem;
        }

        .color-row input[type="color"] {
            width: 60px;
            height: 30px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .tube-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .tube {
                width: 65px;
            }
            .slot {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="move-counter">🎯 MOVES <span id="moveDisplay">0</span></div>
        <div class="buttons">
            <button id="undoBtn">↩ UNDO</button>
            <button id="restartBtn">↺ RESTART</button>
        </div>
    </div>
    <div class="tube-grid" id="tubeGrid"></div>
    <div class="seed-area">
        <input type="text" class="seed-input" id="seedInput" placeholder="SEED">
        <button id="loadSeedBtn" class="primary-cta">LOAD</button>
        <button id="newPuzzleBtn">✨ NEW</button>
        <button id="copySeedBtn">📋 COPY</button>
        <select id="difficultySelect">
            <option value="easy">EASY</option>
            <option value="medium" selected>MED</option>
            <option value="hard">HARD</option>
        </select>
    </div>
    <div class="settings-row">
        <label class="checkbox-label">
            <input type="checkbox" id="showLettersCheck"> <span>LETTERS (A11Y)</span>
        </label>
        <button id="editColorsBtn" class="secondary" style="font-size:0.75rem;">🎨 COLORS</button>
    </div>
</div>

<div class="win-overlay" id="winOverlay">
    <div class="win-modal">
        <h2>✨ SORTED! ✨</h2>
        <p>MOVES: <span id="winMoves"></span></p>
        <button id="winNewPuzzle" class="primary-cta">NEW</button>
        <button id="winRestart" class="secondary">RESTART</button>
        <button id="winCopySeed" class="secondary">COPY SEED</button>
    </div>
</div>

<div class="color-editor-overlay" id="colorEditorOverlay">
    <div class="color-editor-modal">
        <h3>CUSTOMIZE COLORS</h3>
        <div id="colorEditorRows"></div>
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <button id="closeColorEditor">CLOSE</button>
            <button id="resetColorsBtn">RESET DEFAULT</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const DEFAULT_COLORS = [
            { name: 'Red', hex: '#ff0040', letter: 'R' },
            { name: 'Green', hex: '#00ff66', letter: 'G' },
            { name: 'Blue', hex: '#0099ff', letter: 'B' },
            { name: 'Yellow', hex: '#ffdd00', letter: 'Y' },
            { name: 'Purple', hex: '#b300ff', letter: 'P' },
            { name: 'Orange', hex: '#ff6600', letter: 'O' },
            { name: 'Cyan', hex: '#00ffff', letter: 'C' },
            { name: 'Pink', hex: '#ff66b2', letter: 'K' },
            { name: 'Lime', hex: '#ccff00', letter: 'L' },
            { name: 'Brown', hex: '#cc9966', letter: 'W' }
        ];

        function loadColors() {
            const stored = localStorage.getItem('neonSortColors');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length === 10) return parsed;
                } catch(e) {}
            }
            return DEFAULT_COLORS.map(c => ({...c}));
        }

        let COLORS = loadColors();
        const NUM_TUBES = 12;
        const SLOTS_PER_TUBE = 4;
        const NUM_COLORS = 10;

        function mulberry32(a) {
            return function() {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                var t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        let tubes = [], initialTubes = [], moveHistory = [], moveCount = 0;
        let selectedTubeIndex = -1;
        let currentSeed = '', currentDifficulty = 'medium';
        let showLetters = false;

        const tubeGrid = document.getElementById('tubeGrid');
        const moveDisplay = document.getElementById('moveDisplay');
        const undoBtn = document.getElementById('undoBtn');
        const restartBtn = document.getElementById('restartBtn');
        const seedInput = document.getElementById('seedInput');
        const loadSeedBtn = document.getElementById('loadSeedBtn');
        const newPuzzleBtn = document.getElementById('newPuzzleBtn');
        const copySeedBtn = document.getElementById('copySeedBtn');
        const difficultySelect = document.getElementById('difficultySelect');
        const showLettersCheck = document.getElementById('showLettersCheck');
        const winOverlay = document.getElementById('winOverlay');
        const winMovesSpan = document.getElementById('winMoves');
        const winNewPuzzleBtn = document.getElementById('winNewPuzzle');
        const winRestartBtn = document.getElementById('winRestart');
        const winCopySeedBtn = document.getElementById('winCopySeed');
        const editColorsBtn = document.getElementById('editColorsBtn');
        const colorEditorOverlay = document.getElementById('colorEditorOverlay');
        const colorEditorRows = document.getElementById('colorEditorRows');
        const closeColorEditor = document.getElementById('closeColorEditor');
        const resetColorsBtn = document.getElementById('resetColorsBtn');

        function deepCopyTubes(t) { return t.map(t => [...t]); }
        function getOccupiedCount(tube) {
            let c = 0;
            for (let i = 0; i < SLOTS_PER_TUBE; i++) {
                if (tube[i] !== null) c++;
                else break;
            }
            return c;
        }
        function getBottomBlock(tube) {
            const occ = getOccupiedCount(tube);
            if (!occ) return [];
            const color = tube[occ-1];
            const block = [];
            for (let i = occ-1; i >= 0 && tube[i]===color; i--) block.push(color);
            return block;
        }
        function canPlace(tube, color) {
            const occ = getOccupiedCount(tube);
            if (occ === 0) return true;
            if (occ >= SLOTS_PER_TUBE) return false;
            return tube[occ-1] === color;
        }
        function availableSlots(tube) { return SLOTS_PER_TUBE - getOccupiedCount(tube); }

        function performMove(src, dst) {
            if (src === dst) return false;
            const srcT = tubes[src], dstT = tubes[dst];
            const block = getBottomBlock(srcT);
            if (!block.length) return false;
            const color = block[0];
            if (!canPlace(dstT, color)) return false;
            const cap = availableSlots(dstT);
            if (!cap) return false;
            const cnt = Math.min(block.length, cap);
            moveHistory.push(deepCopyTubes(tubes));
            const srcOcc = getOccupiedCount(srcT);
            for (let i = 0; i < cnt; i++) srcT[srcOcc-1-i] = null;
            const dstOcc = getOccupiedCount(dstT);
            for (let i = 0; i < cnt; i++) dstT[dstOcc+i] = color;
            return true;
        }

        function isWinState(state) {
            const counts = {};
            for (let t of state) {
                const occ = getOccupiedCount(t);
                if (!occ) continue;
                if (occ !== SLOTS_PER_TUBE) return false;
                const first = t[0];
                if (t.some(c => c !== first)) return false;
                counts[first] = (counts[first]||0)+1;
            }
            return Object.keys(counts).length === NUM_COLORS && Object.values(counts).every(v=>v===1);
        }

        function normalizeState(s) {
            return s.map(t=>t.map(c=>c||'null').join(',')).sort().join('|');
        }
        function isSolvable(state, maxD=40) {
            if (isWinState(state)) return true;
            const visited = new Set();
            const stack = [{ s: deepCopyTubes(state), d:0 }];
            visited.add(normalizeState(state));
            while(stack.length) {
                const {s,d} = stack.pop();
                if(d>=maxD) continue;
                for(let src=0;src<s.length;src++){
                    const blk = getBottomBlock(s[src]);
                    if(!blk.length) continue;
                    const col = blk[0];
                    for(let dst=0;dst<s.length;dst++){
                        if(src===dst || !canPlace(s[dst],col) || !availableSlots(s[dst])) continue;
                        const ns = deepCopyTubes(s);
                        const srcO = getOccupiedCount(ns[src]);
                        const cap = availableSlots(ns[dst]);
                        const cnt = Math.min(blk.length, cap);
                        for(let i=0;i<cnt;i++) ns[src][srcO-1-i]=null;
                        const dstO = getOccupiedCount(ns[dst]);
                        for(let i=0;i<cnt;i++) ns[dst][dstO+i]=col;
                        const key = normalizeState(ns);
                        if(!visited.has(key)){
                            if(isWinState(ns)) return true;
                            visited.add(key);
                            stack.push({s:ns,d:d+1});
                        }
                    }
                }
            }
            return false;
        }

        function generateRandomDistribution(rand) {
            const pool = [];
            COLORS.forEach(c => { for(let i=0;i<4;i++) pool.push(c.name); });
            for(let i=pool.length-1;i>0;i--){
                const j = Math.floor(rand()*(i+1));
                [pool[i],pool[j]] = [pool[j],pool[i]];
            }
            const state = Array.from({length:NUM_TUBES}, ()=>new Array(SLOTS_PER_TUBE).fill(null));
            let idx=0;
            for(let t=0;t<NUM_TUBES;t++) for(let s=0;s<SLOTS_PER_TUBE;s++) if(idx<pool.length) state[t][s]=pool[idx++];
            return state;
        }

        function generatePuzzle(seed, diff) {
            for(let att=0; att<100; att++){
                const r = mulberry32(hashString(seed+'::'+att));
                const cand = generateRandomDistribution(r);
                if(isSolvable(cand, 35+att*2)) return cand;
            }
            return [
                ['Red','Green','Blue','Red'],
                ['Green','Blue','Red','Green'],
                ['Blue','Red','Green','Blue'],
                ['Yellow','Purple','Orange','Yellow'],
                ['Purple','Orange','Cyan','Purple'],
                ['Orange','Cyan','Pink','Orange'],
                ['Cyan','Pink','Lime','Cyan'],
                ['Pink','Lime','Brown','Pink'],
                ['Lime','Brown','Yellow','Lime'],
                ['Brown','Yellow','Purple','Brown'],
                [null,null,null,null],[null,null,null,null]
            ];
        }

        function renderTubes() {
            tubeGrid.innerHTML = '';
            tubes.forEach((tube, idx) => {
                const d = document.createElement('div');
                d.className = 'tube' + (idx===selectedTubeIndex?' selected':'');
                if(!getOccupiedCount(tube)) d.classList.add('empty');
                for(let s=0; s<SLOTS_PER_TUBE; s++){
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    const col = tube[s];
                    if(col){
                        slot.classList.add('filled');
                        const cobj = COLORS.find(c=>c.name===col);
                        slot.style.setProperty('--color', cobj.hex);
                        if(showLetters) slot.innerHTML = `<span class="letter-overlay">${cobj.letter}</span>`;
                    }
                    d.appendChild(slot);
                }
                d.addEventListener('click', ()=> handleTubeClick(idx));
                tubeGrid.appendChild(d);
            });
        }

        function handleTubeClick(idx){
            if(selectedTubeIndex===-1){
                if(getOccupiedCount(tubes[idx])>0){ selectedTubeIndex=idx; renderTubes(); }
            }else if(selectedTubeIndex===idx){
                selectedTubeIndex=-1; renderTubes();
            }else{
                if(performMove(selectedTubeIndex, idx)){
                    moveCount++; moveDisplay.textContent=moveCount;
                    selectedTubeIndex=-1; renderTubes();
                    if(isWinState(tubes)){
                        winMovesSpan.textContent=moveCount;
                        winOverlay.style.display='flex';
                    }
                }else{
                    selectedTubeIndex=-1; renderTubes();
                }
            }
        }

        function undoMove(){
            if(!moveHistory.length) return;
            tubes = moveHistory.pop();
            moveCount--; moveDisplay.textContent=moveCount;
            selectedTubeIndex=-1; renderTubes();
            winOverlay.style.display='none';
        }

        function restartPuzzle(){
            tubes = deepCopyTubes(initialTubes);
            moveHistory=[]; moveCount=0; moveDisplay.textContent=0;
            selectedTubeIndex=-1; renderTubes();
            winOverlay.style.display='none';
        }

        function loadPuzzle(seed, diff){
            currentSeed=seed; currentDifficulty=diff;
            seedInput.value=seed; difficultySelect.value=diff;
            const p = generatePuzzle(seed, diff);
            initialTubes = deepCopyTubes(p);
            tubes = deepCopyTubes(p);
            moveHistory=[]; moveCount=0; moveDisplay.textContent=0;
            selectedTubeIndex=-1; renderTubes();
            winOverlay.style.display='none';
        }

        function newRandomSeed() { return Math.random().toString(36).substr(2,8)+Date.now().toString(36); }

        function buildColorEditor() {
            colorEditorRows.innerHTML = '';
            COLORS.forEach((c, i) => {
                const row = document.createElement('div');
                row.className = 'color-row';
                row.innerHTML = `<span style="color:${c.hex}">${c.name}</span>
                                 <input type="color" value="${c.hex}" data-index="${i}">`;
                colorEditorRows.appendChild(row);
            });
            document.querySelectorAll('#colorEditorRows input[type="color"]').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    COLORS[idx].hex = e.target.value;
                    localStorage.setItem('neonSortColors', JSON.stringify(COLORS));
                    renderTubes();
                });
            });
        }

        editColorsBtn.addEventListener('click', ()=>{
            buildColorEditor();
            colorEditorOverlay.style.display='flex';
        });
        closeColorEditor.addEventListener('click', ()=> colorEditorOverlay.style.display='none');
        resetColorsBtn.addEventListener('click', ()=>{
            COLORS = DEFAULT_COLORS.map(c=>({...c}));
            localStorage.setItem('neonSortColors', JSON.stringify(COLORS));
            buildColorEditor();
            renderTubes();
        });

        undoBtn.addEventListener('click', undoMove);
        restartBtn.addEventListener('click', restartPuzzle);
        newPuzzleBtn.addEventListener('click', ()=> loadPuzzle(newRandomSeed(), currentDifficulty));
        loadSeedBtn.addEventListener('click', ()=>{
            let s = seedInput.value.trim() || newRandomSeed();
            loadPuzzle(s, currentDifficulty);
        });
        copySeedBtn.addEventListener('click', ()=> navigator.clipboard.writeText(currentSeed).then(()=>alert('Seed copied!')));
        difficultySelect.addEventListener('change', e=> loadPuzzle(currentSeed, e.target.value));
        showLettersCheck.addEventListener('change', e=>{ showLetters=e.target.checked; renderTubes(); });
        winNewPuzzleBtn.addEventListener('click', ()=>{ winOverlay.style.display='none'; loadPuzzle(newRandomSeed(), currentDifficulty); });
        winRestartBtn.addEventListener('click', ()=>{ winOverlay.style.display='none'; restartPuzzle(); });
        winCopySeedBtn.addEventListener('click', ()=> navigator.clipboard.writeText(currentSeed));

        loadPuzzle('neon-arcade', 'medium');
    })();
</script>
<script>
    // ... (keep all your existing game logic)

    // NEW: move recording
    let currentMoves = [];  // array of { src, dst }

    // Modify performMove to record
    const originalPerformMove = performMove;
    performMove = function(src, dst) {
        const result = originalPerformMove(src, dst);
        if (result) {
            currentMoves.push({ src, dst });
        }
        return result;
    };

    // Modify restart / new puzzle to clear moves
    const originalRestart = restartPuzzle;
    restartPuzzle = function() {
        originalRestart();
        currentMoves = [];
    };
    const originalLoadPuzzle = loadPuzzle;
    loadPuzzle = function(seed, diff) {
        originalLoadPuzzle(seed, diff);
        currentMoves = [];
    };

    // After win, show name prompt & submit
    const API_BASE = 'https://color-sort-backend.onrender.com'; // << CHANGE THIS
    async function submitScore(name) {
        const payload = {
            seed: currentSeed,
            difficulty: currentDifficulty,
            playerName: name,
            moves: currentMoves
        };
        try {
            const res = await fetch(`${API_BASE}/api/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                alert('Score submitted!');
                fetchLeaderboard();
            } else {
                alert('Error: ' + data.error);
            }
        } catch(e) {
            alert('Network error');
        }
    }

    async function fetchLeaderboard() {
        try {
            const res = await fetch(`${API_BASE}/api/leaderboard?difficulty=${currentDifficulty}`);
            const data = await res.json();
            // display leaderboard in a modal (implement your own UI)
            console.log('Leaderboard:', data);
        } catch(e) {}
    }

    // Override win detection to prompt name
    const originalCheckWin = checkWinAndShow;
    checkWinAndShow = function() {
        originalCheckWin();
        if (isWinState(tubes)) {
            // Delay to let overlay show
            setTimeout(() => {
                const name = prompt('Congratulations! Enter your name for the leaderboard:');
                if (name) submitScore(name.trim());
            }, 500);
        }
    };

    // Optional: add a "Leaderboard" button in UI
</script>
